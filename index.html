<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISSA STUDIO JIWOO</title>
    <!-- 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- 폰트어썸 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 전체 글래스모피즘 공통 클래스 */
        .glass-box {
            background: rgba(15, 15, 15, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-box:hover, .glass-box:active {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(255, 255, 255, 0.08);
        }

        /* 상단 히어로 섹션 */
        .hero {
            background: radial-gradient(circle at center, rgba(30, 30, 30, 0.4) 0%, rgba(0, 0, 0, 0.8) 80%);
            padding: 80px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-img {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.4));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .highlight {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .tagline {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background-color: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: #ffffff;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        /* 본문 컨테이너 */
        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .project-card {
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        /* Sense UI 스타일 플립 시계 전용 CSS */
        .flip-clock-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .flip-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .flip-card {
            position: relative;
            width: 64px;
            height: 76px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
        }

        .flip-card .top, .flip-card .bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            left: 0;
            overflow: hidden;
        }

        .flip-card .top {
            top: 0;
            background: linear-gradient(to bottom, rgba(45,45,45,0.95), rgba(22,22,22,0.95));
            border-bottom: 1px solid rgba(0, 0, 0, 0.7);
            align-items: flex-end;
            padding-bottom: 2px;
        }

        .flip-card .bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(30,30,30,0.95), rgba(12,12,12,0.95));
            align-items: flex-start;
            padding-top: 2px;
        }

        .flip-colon {
            font-size: 2.2rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            margin-top: -22px;
        }

        .flip-label {
            font-size: 0.65rem;
            color: #888888;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666666;
            font-size: 0.85rem;
        }

        .total-counter {
            margin-top: 8px;
            color: #888888;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="profile-card">
            <div class="profile-img">👋</div>
            <h1>안녕하세요, <span class="highlight">박지우</span>입니다!</h1>
            <p class="tagline">대한민국을 살아가는 학생 개발자, 유튜버 입니다.</p>
            
            <div class="social-icons">
                <a href="https://github.com" target="_blank" title="GitHub" class="icon-btn"><i class="fa-brands fa-github"></i></a>
                <a href="https://youtube.com/channel/UCbAqgKjHOsttp_sFvGJ1pNA?si=dKZLtJ53Swo3Jn8n" target="_blank" title="YouTube" class="icon-btn"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://discord.com" target="_blank" title="Discord" class="icon-btn"><i class="fa-brands fa-discord"></i></a>
                <a href="https://open.spotify.com" target="_blank" title="Spotify Profile" class="icon-btn"><i class="fa-brands fa-spotify"></i></a>
                <a href="mailto:ffdffd9212@gmail.com" title="Email" class="icon-btn"><i class="fa-solid fa-envelope"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Sense UI 스타일 플립 시계 섹션 -->
        <section class="section">
            <h2>🕒 Live Sense Clock</h2>
            <div class="project-card glass-box" style="padding: 35px 20px;">
                <div class="flip-clock-wrapper">
                    <!-- 시 -->
                    <div class="flip-unit">
                        <div class="flip-card">
                            <div class="top" id="hour-top">00</div>
                            <div class="bottom" id="hour-bottom">00</div>
                        </div>
                        <span class="flip-label">HOURS</span>
                    </div>
                    <span class="flip-colon">:</span>
                    <!-- 분 -->
                    <div class="flip-unit">
                        <div class="flip-card">
                            <div class="top" id="minute-top">00</div>
                            <div class="bottom" id="minute-bottom">00</div>
                        </div>
                        <span class="flip-label">MINUTES</span>
                    </div>
                    <span class="flip-colon">:</span>
                    <!-- 초 -->
                    <div class="flip-unit">
                        <div class="flip-card">
                            <div class="top" id="second-top">00</div>
                            <div class="bottom" id="second-bottom">00</div>
                        </div>
                        <span class="flip-label">SECONDS</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>💻 About Me</h2>
            <div class="project-card glass-box">
                <p style="color: #cccccc; margin: 0;">안녕하세요! 저는 대한민국 국적의 학생 입니다. 코딩, 컴퓨터를 좋아하고, 기기제품에 대해 관심이 제일 많습니다.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>2026년 9월 5일에 추가된 서버</p>
        <div class="total-counter">TOTAL VISITS: <span id="visit-count">1</span></div>
    </footer>

    <!-- 플립 시계 실시간 동작 스크립트 -->
    <script>
        // 방문자 수 카운터 로직
        let visits = localStorage.getItem('site_total_visits');
        if (!visits) {
            visits = 128;
        } else {
            visits = parseInt(visits) + 1;
        }
        localStorage.setItem('site_total_visits', visits);
        document.getElementById('visit-count').textContent = visits;

        // 플립 시계 실시간 업데이트
        function updateFlipClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            setDigit('hour', hours);
            setDigit('minute', minutes);
            setDigit('second', seconds);
        }

        function setDigit(unit, value) {
            const topEl = document.getElementById(`${unit}-top`);
            const bottomEl = document.getElementById(`${unit}-bottom`);
            
            if (topEl.textContent !== value) {
                topEl.textContent = value;
                bottomEl.textContent = value;
            }
        }

        setInterval(updateFlipClock, 1000);
        updateFlipClock();
    </script>
</body>
</html>
