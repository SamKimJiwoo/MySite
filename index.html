<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_TERMINAL // JIWOO</title>
    <style>
        /* --- 사이버펑크 네온 기본 스타일 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        /* 배경 네온 그랜드 글리치 효과 포인트 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            pointer-events: none;
            background-size: 100% 4px, 6px 100%;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }

        /* 공통 네온 카드 박스 */
        .neon-box {
            background: rgba(5, 5, 8, 0.85);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
        }

        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* --- 주가 검색 위젯 스타일 --- */
        .stock-widget h3 {
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-align: center;
        }

        .stock-search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stock-search-box input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #ff007f;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 0 5px rgba(255, 0, 127, 0.3);
        }

        .stock-search-box input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .stock-search-box button {
            background: linear-gradient(135deg, #ff007f, #00f3ff);
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            color: #050508;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
        }

        .stock-search-box button:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.7);
        }

        .stock-result-card {
            background: rgba(10, 10, 18, 0.9);
            border: 1px dashed #ff007f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            display: none;
        }

        .stock-result-card.active {
            display: block;
        }

        .stock-title {
            font-size: 1.1rem;
            color: #ff007f;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stock-price {
            font-size: 1.5rem;
            color: #00f3ff;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.4);
        }

        /* 슬라이드 업 쿠키 배너 감성 */
        .cookie-banner {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: bottom 0.5s ease-in-out;
            z-index: 1000;
        }

        .cookie-banner.show {
            bottom: 20px;
        }

        .cookie-banner button {
            background: #ff007f;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 메인 헤더 타이틀 -->
        <div class="neon-box" style="text-align: center;">
            <h1>JIWOO_TERMINAL</h1>
            <div class="subtitle" id="digitalClock">--:--:-- // SYSTEM ONLINE</div>
        </div>

        <!-- 주가 검색 위젯 -->
        <div class="neon-box stock-widget">
            <h3>📈 CYBER_STOCK TERMINAL</h3>
            <div class="stock-search-box">
                <input type="text" id="stockInput" placeholder="종목명 또는 티커 입력...">
                <button id="stockSearchBtn">검색</button>
            </div>
            <div id="stockResult" class="stock-result-card">
                <div class="stock-title" id="resName">--</div>
                <div class="stock-price" id="resPrice">--</div>
                <div style="font-size: 0.85rem; color: #888; margin-top: 5px;" id="resDetail">상태: 대기 중</div>
            </div>
        </div>
    </div>

    <!-- 하단 슬라이드 업 쿠키 배너 -->
    <div id="cookieBanner" class="cookie-banner">
        <span>🔒 Secure Protocol Active</span>
        <button id="cookieClose">확인</button>
    </div>

    <script>
        // 1. 디지털 시계 구동
        function updateClock() {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            document.getElementById('digitalClock').innerText = `${timeString} // SYSTEM ONLINE`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 쿠키 배너 2초 뒤 슬라이드 업
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('cookieBanner').classList.add('show');
            }, 2000);
        });

        document.getElementById('cookieClose').addEventListener('click', () => {
            document.getElementById('cookieBanner').classList.remove('show');
        });

        // 3. 주가 검색 기능 연동
        const stockInput = document.getElementById('stockInput');
        const stockSearchBtn = document.getElementById('stockSearchBtn');
        const stockResult = document.getElementById('stockResult');
        const resName = document.getElementById('resName');
        const resPrice = document.getElementById('resPrice');
        const resDetail = document.getElementById('resDetail');

        stockSearchBtn.addEventListener('click', searchStock);
        stockInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchStock();
        });

        function searchStock() {
            const query = stockInput.value.trim();
            if (!query) return;

            resName.innerText = query.toUpperCase();
            resPrice.innerText = "조회 중...";
            resDetail.innerText = "Connecting to financial network...";
            stockResult.classList.add('active');

            // 추후 실제 금융 API 연동 시 이 부분을 교체하면 됩니다!
            setTimeout(() => {
                resPrice.sendStatus = "$ 182.50 (USD)";
                resPrice.innerText = "$ 182.50 (USD)";
                resDetail.innerText = "통신 성공 / 가상 시세 로드 완료";
            }, 600);
        }
    </script>
</body>
</html>
