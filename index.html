<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM MAINTENANCE // SERVER OFFLINE</title>
    <!-- 구글 폰트 & 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 배경 네온 그리드 스캔라인 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 127, 0.03), rgba(0, 243, 255, 0.03));
            z-index: 1;
            pointer-events: none;
            background-size: 100% 4px, 6px 100%;
        }

        .maintenance-card {
            position: relative;
            z-index: 2;
            background: rgba(10, 10, 18, 0.9);
            border: 1px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        /* 네온 로딩 원 (Spinner) */
        .spinner-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid #00f3ff;
            border-right: 4px solid #ff007f;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .spinner-icon {
            position: absolute;
            color: #ff007f;
            font-size: 1.5rem;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        p {
            color: #cccccc;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .status-tag {
            display: inline-block;
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid #ff007f;
            color: #ff007f;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <!-- 회전하는 네온 로딩 원 -->
        <div class="spinner-wrapper">
            <div class="spinner"></div>
            <i class="fa-solid fa-wrench spinner-icon"></i>
        </div>

        <h1>SERVER MAINTENANCE</h1>
        <p>서버 안전성을 위해 서버를 점검하고 있습니다.<br>이용에 불편을 드려 죄송합니다. 문의: contact@krpjw-1119.kro.kr</p>

        <div class="status-tag">
            <i class="fa-solid fa-circle-notch fa-spin"></i> SERVER CHECKING..
        </div>
    </div>

</body>
</html>
